<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Quest: Cyber Office</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #273549;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-emerald: #059669;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-blue: #3b82f6;
      --border-color: #334155;
      --border-light: #475569;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-card: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --accent-cyan: #0891b2;
      --accent-green: #059669;
      --accent-emerald: #047857;
      --accent-amber: #d97706;
      --accent-rose: #e11d48;
      --accent-blue: #2563eb;
      --border-color: #cbd5e1;
      --border-light: #e2e8f0;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-stack);
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
    }
    .brand-icon {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      display: block;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .role-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .role-badge .dot {
      width: 8px;
      height: 8px;
      background: var(--accent-cyan);
      border-radius: 50%;
    }
    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent-cyan); }
    .layout-container {
      display: flex;
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      gap: 1.25rem;
    }
    nav.sidebar {
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: var(--bg-surface);
      color: var(--text-main);
    }
    .nav-btn.active {
      background: var(--bg-surface);
      color: var(--accent-cyan);
      border-color: var(--border-color);
      border-left: 4px solid var(--accent-cyan);
    }
    main.view-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-width: 0;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--card-shadow);
    }
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .stat-tile {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .stat-tile .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-tile .value { font-size: 1.6rem; font-weight: 800; color: var(--text-main); }
    .stat-tile .sub { font-size: 0.75rem; color: var(--accent-cyan); }
    .btn {
      background: var(--accent-cyan);
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .btn-secondary:hover { border-color: var(--accent-cyan); }
    .btn-outline-danger {
      background: transparent;
      border: 1px solid var(--accent-rose);
      color: var(--accent-rose);
    }
    .quiz-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .quiz-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      background: var(--bg-card);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-light);
    }
    .timer-badge {
      font-family: monospace;
      font-weight: 700;
      color: var(--accent-amber);
      font-size: 1.1rem;
    }
    .badge-tag {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-cyan);
    }
    .passage-box {
      background: var(--bg-card);
      border-left: 4px solid var(--accent-cyan);
      padding: 1.2rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
    }
    .question-stem {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.65rem;
    }
    .choice-item {
      background: var(--bg-card);
      border: 2px solid var(--border-light);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: all 0.2s;
      font-size: 0.95rem;
    }
    .choice-item:hover {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.05);
    }
    .choice-item .key {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .choice-item.selected {
      border-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.1);
    }
    .choice-item.correct {
      border-color: var(--accent-green) !important;
      background: rgba(16, 185, 129, 0.15) !important;
    }
    .choice-item.wrong {
      border-color: var(--accent-rose) !important;
      background: rgba(244, 63, 94, 0.15) !important;
    }
    .explanation-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      border-top: 4px solid var(--accent-green);
    }
    .trap-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px dashed var(--accent-amber);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--accent-amber);
    }
    .flashcard {
      min-height: 260px;
      perspective: 1000px;
      cursor: pointer;
    }
    .flashcard-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 260px;
    }
    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      text-align: center;
    }
    .card-back {
      transform: rotateY(180deg);
      align-items: flex-start;
      text-align: left;
      overflow-y: auto;
      justify-content: flex-start;
    }
    .word-title { font-size: 2rem; font-weight: 800; color: var(--accent-cyan); }
    .word-ipa { font-family: monospace; color: var(--accent-amber); margin: 0.4rem 0 1rem; }
    .word-meaning { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
    .word-example { font-style: italic; color: var(--text-sub); border-left: 3px solid var(--accent-cyan); padding-left: 0.75rem; margin-bottom: 0.75rem; }
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--accent-cyan);
    }
    .leitner-boxes {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      justify-content: center;
    }
    .l-box {
      flex: 1;
      padding: 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      text-align: center;
      font-size: 0.75rem;
    }
    .l-box.active { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.1); }
    .canvas-container {
      width: 100%;
      height: 240px;
      position: relative;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .error-item {
      background: var(--bg-card);
      border-left: 4px solid var(--accent-rose);
      padding: 0.9rem 1.1rem;
      border-radius: 0 8px 8px 0;
      margin-bottom: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      max-width: 500px;
      width: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--card-shadow);
    }
    /* Listening & Trap Hunter UI */
    .audio-control-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 0.85rem 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.85rem;
    }
    .audio-playing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }
    .sound-wave-bar {
      width: 3px;
      height: 14px;
      background: var(--accent-cyan);
      border-radius: 2px;
      animation: soundWave 0.8s infinite ease-in-out alternate;
    }
    .sound-wave-bar:nth-child(2) { animation-delay: 0.2s; height: 18px; }
    .sound-wave-bar:nth-child(3) { animation-delay: 0.4s; height: 10px; }
    @keyframes soundWave {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.3); }
    }
    .svg-illustration-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .svg-illustration-box svg {
      max-width: 100%;
      height: auto;
      max-height: 260px;
      border-radius: 8px;
    }
    .transcript-box {
      background: rgba(15, 23, 42, 0.6);
      border-left: 4px solid var(--accent-amber);
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-top: 0.75rem;
    }
    .transcript-box mark {
      background: rgba(6, 182, 212, 0.25);
      color: var(--accent-cyan);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-weight: 700;
    }
    .trap-hunter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .trap-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: all 0.2s;
    }
    .trap-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }
    /* Boss Battle HUD & Cyber Arena */
    .boss-arena {
      background: radial-gradient(circle at top, rgba(244, 63, 94, 0.15), var(--bg-surface) 75%);
      border: 2px solid var(--accent-rose);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.25);
    }
    .boss-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      padding: 1.25rem;
      border-radius: 12px;
    }
    .boss-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .boss-avatar-svg {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.6));
    }
    .boss-meters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      flex: 1;
      min-width: 280px;
    }
    .meter-box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .meter-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .meter-track {
      height: 12px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .meter-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease;
    }
    .boss-hp-bar {
      background: linear-gradient(90deg, #f43f5e, #fb7185);
    }
    .player-integrity-bar {
      background: linear-gradient(90deg, #10b981, #06b6d4);
    }
    .promotion-card {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.3);
    }
    .rank-insignia {
      width: 90px;
      height: 90px;
      margin: 0 auto 1.2rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      color: #000;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
    }
    @media (max-width: 768px) {
      .layout-container { flex-direction: column; padding: 0.75rem; }
      nav.sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 0.5rem;
      }
      .nav-btn { white-space: nowrap; padding: 0.5rem 0.8rem; font-size: 0.85rem; }
      .header-actions .role-badge { display: none; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand" onclick="app.navigate('dashboard')">
      <div class="brand-icon">TQ</div>
      <div>
        <div class="brand-title">TOEIC Quest</div>
        <span class="brand-sub">Cyber Office v1.0</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="role-badge" id="roleBadge">
        <span class="dot"></span>
        <span id="roleTitle">Intern</span> (Lv.<span id="userLevel">1</span>)
      </div>
      <button class="icon-btn" onclick="app.toggleSound()" id="soundBtn" title="Bật/Tắt âm thanh">🔊</button>
      <button class="icon-btn" onclick="app.toggleTheme()" id="themeBtn" title="Chuyển theme">🌓</button>
      <button class="icon-btn" onclick="app.openSettings()" title="Cài đặt & Sao lưu">⚙️</button>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="layout-container">
    <nav class="sidebar">
      <button class="nav-btn active" onclick="app.navigate('dashboard')" data-view="dashboard">📊 Tổng quan (Dashboard)</button>
      <button class="nav-btn" onclick="app.navigate('placement')" data-view="placement">🎯 Placement Check</button>
      <button class="nav-btn" onclick="app.navigate('daily')" data-view="daily">⚡ Nhiệm vụ ngày (Daily)</button>
      <button class="nav-btn" onclick="app.navigate('minitest')" data-view="minitest" style="color: var(--accent-amber);">⏱️ Mini Test 30 câu (10–990)</button>
      <button class="nav-btn" onclick="app.navigate('part1')" data-view="part1">🎧 Luyện Part 1 (Photographs)</button>
      <button class="nav-btn" onclick="app.navigate('part2')" data-view="part2">🗣️ Luyện Part 2 (Q&A Response)</button>
      <button class="nav-btn" onclick="app.navigate('part5')" data-view="part5">📝 Luyện Part 5 (Incomplete)</button>
      <button class="nav-btn" onclick="app.navigate('part6')" data-view="part6">📄 Luyện Part 6 (Text Completion)</button>
      <button class="nav-btn" onclick="app.navigate('part7')" data-view="part7">📑 Luyện Part 7 (Passages)</button>
      <button class="nav-btn" onclick="app.navigate('traphunter')" data-view="traphunter">🏹 Thợ săn bẫy (Trap Hunter)</button>
      <button class="nav-btn" onclick="app.navigate('boss')" data-view="boss" style="color: var(--accent-rose);">👾 Boss Level (Sự cố Cyber)</button>
      <button class="nav-btn" onclick="app.navigate('vocab')" data-view="vocab">🧠 Đấu trường Từ vựng</button>
      <button class="nav-btn" onclick="app.navigate('errors')" data-view="errors">📕 Sổ tay lỗi sai</button>
    </nav>

    <main class="view-stage" id="stageContent">
      <!-- Dynamic Views injected here -->
    </main>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalSlot" hidden></div>

  <!-- APPLICATION SCRIPT & DATA -->
  <script>
/**
 * =====================================================================
 * DATA SCHEMA: QUESTIONS & VOCABULARY
 * 25-30% IT / Cyber Security context, balance standard TOEIC business
 * =====================================================================
 */
const QUESTIONS = [
  // --- PART 1: PHOTOGRAPHS (4 SVG ILLUSTRATED QUESTIONS) ---
  {
    id: "p1-001", part: 1, level: 2, topic: "IT & Server Room",
    skillTags: ["listening", "photographs", "it-equipment"],

class SoundSynth {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  }
  playCorrect() {
    if (!app.state.user.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(523.25, now); // C5
    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  }
  playWrong() {
    if (!app.state.user.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, now); // A3
    osc.frequency.linearRampToValueAtTime(150, now + 0.25);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  }
  playLevelUp() {
    if (!app.state.user.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    const notes = [440, 554.37, 659.25, 880];
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const start = this.ctx.currentTime + i * 0.1;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.2, start);
      gain.gain.exponentialRampToValueAtTime(0.01, start + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(start);
      osc.stop(start + 0.25);
    });
  }
}

class ToeicQuestApp {
  constructor() {
    this.state = this.loadState();
    this.sound = new SoundSynth();
    this.currentView = "dashboard";
    this.activeQuiz = null;
    this.vocabIndex = 0;
    this.vocabStudyMode = "card"; // card, quiz, type
  }

  loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        // Merge with defaults to prevent broken structures
        return {
          ...DEFAULT_STATE,
          ...parsed,
          user: { ...DEFAULT_STATE.user, ...parsed.user },
          adaptive: { ...DEFAULT_STATE.adaptive, ...parsed.adaptive },
          progress: { ...DEFAULT_STATE.progress, ...parsed.progress }
        };
      }
    } catch (e) {
      console.warn("Error loading stored state, starting fresh.", e);
    }
    // Initialize Leitner Box 1 with all words if empty
    const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
    fresh.progress.leitnerBoxes.b1 = VOCAB.map(v => v.word);
    return fresh;
  }

  saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
    } catch (e) {
      console.error("Failed to save state to localStorage", e);
    }
    this.updateHeaderUI();
  }

  init() {
    this.applyTheme(this.state.user.theme);
    this.checkStreak();
    this.initKeyboardNav();
    this.navigate("dashboard");
    this.updateHeaderUI();
  }

  checkStreak() {
    const today = new Date().toISOString().split("T")[0];
    const last = this.state.user.lastActiveDate;
    if (last) {
      const diffDays = Math.floor((new Date(today) - new Date(last)) / (1000 * 60 * 60 * 24));
      if (diffDays === 1) {
        this.state.user.streak += 1;
      } else if (diffDays > 1) {
        this.state.user.streak = 1;
      }
    }
    this.state.user.lastActiveDate = today;
    this.saveState();
  }

  applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    const btn = document.getElementById("themeBtn");
    if (btn) btn.textContent = theme === "dark" ? "🌙" : "☀️";
    this.state.user.theme = theme;
  }

  toggleTheme() {
    const next = this.state.user.theme === "dark" ? "light" : "dark";
    this.applyTheme(next);
    this.saveState();
  }

  toggleSound() {
    this.state.user.soundEnabled = !this.state.user.soundEnabled;
    const btn = document.getElementById("soundBtn");
    if (btn) btn.textContent = this.state.user.soundEnabled ? "🔊" : "🔇";
    this.saveState();
  }

  updateHeaderUI() {
    const roleTitle = document.getElementById("roleTitle");
    const userLevel = document.getElementById("userLevel");
    const soundBtn = document.getElementById("soundBtn");
    if (roleTitle) roleTitle.textContent = this.state.user.role;
    if (userLevel) userLevel.textContent = this.state.user.level;
    if (soundBtn) soundBtn.textContent = this.state.user.soundEnabled ? "🔊" : "🔇";
  }

  gainXP(pts) {
    this.state.user.xp += pts;
    const needed = this.state.user.level * 100;
    if (this.state.user.xp >= needed) {
      this.state.user.level += 1;
      this.state.user.xp -= needed;
      this.updateCyberRole();
      this.sound.playLevelUp();
      this.showToast(`🎉 CHÚC MỪNG THĂNG CẤP! Bạn đã đạt Cấp ${this.state.user.level} (${this.state.user.role})!`);
    }
    this.saveState();
  }

  updateCyberRole() {
    const lv = this.state.user.level;
    if (lv < 3) this.state.user.role = "Intern";
    else if (lv < 6) this.state.user.role = "Junior Analyst";
    else if (lv < 10) this.state.user.role = "Senior Specialist";
    else if (lv < 15) this.state.user.role = "Team Lead";
    else this.state.user.role = "CISO";
  }

  showToast(msg) {
    const toast = document.createElement("div");
    toast.style.position = "fixed";
    toast.style.bottom = "20px";
    toast.style.right = "20px";
    toast.style.background = "var(--accent-cyan)";
    toast.style.color = "#000";
    toast.style.fontWeight = "bold";
    toast.style.padding = "0.75rem 1.25rem";
    toast.style.borderRadius = "8px";
    toast.style.boxShadow = "0 4px 14px rgba(0,0,0,0.3)";
    toast.style.zIndex = "999";
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  navigate(viewName) {
    this.currentView = viewName;
    document.querySelectorAll(".nav-btn").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-view") === viewName);
    });
    const stage = document.getElementById("stageContent");
    if (!stage) return;

    if (this.activeQuiz && !this.activeQuiz.isDone) {
      this.activeQuiz.stopAudio();
    }

    switch (viewName) {
      case "dashboard":
        this.renderDashboard(stage);
        break;
      case "placement":
        this.startPlacementTest();
        break;
      case "daily":
        this.renderDailyMission(stage);
        break;
      case "part1":
        this.startPartPractice(1);
        break;
      case "part2":
        this.startPartPractice(2);
        break;
      case "part5":
        this.startPartPractice(5);
        break;
      case "part7":
        this.startPartPractice(7);
        break;
      case "traphunter":
        this.renderTrapHunter(stage);
        break;
      case "part6":
        this.startPartPractice(6);
        break;
      case "minitest":
        this.startMiniTest();
        break;
      case "boss":
        this.renderBossArena(stage);
        break;
      case "vocab":
        this.renderVocabArena(stage);
        break;
      case "errors":
        this.renderErrorNotebook(stage);
        break;
      default:
        this.renderDashboard(stage);
    }
  }

  initKeyboardNav() {
    window.addEventListener("keydown", (e) => {
      // Don't intercept if user is typing in an input
      if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;

      if (this.activeQuiz && !this.activeQuiz.isDone) {
        if (["1", "2", "3", "4"].includes(e.key)) {
          const idx = parseInt(e.key, 10) - 1;
          this.activeQuiz.handleSelectChoice(idx);
        } else if (e.key === "Enter") {
          this.activeQuiz.handleNext();
        } else if (e.code === "Space" || e.key === " ") {
          e.preventDefault();
          this.activeQuiz.playCurrentAudio();
        }
      }
    });
  }

  drawChart(canvasId, items) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    const w = rect.width;
    const h = rect.height;
    ctx.clearRect(0, 0, w, h);

    const barWidth = 44;
    const gap = 30;
    const totalBarsWidth = items.length * barWidth + (items.length - 1) * gap;
    let startX = (w - totalBarsWidth) / 2;
    const bottomY = h - 35;
    const maxBarH = h - 60;

    items.forEach((item) => {
      const barH = (Math.max(item.value, 4) / 100) * maxBarH;
      const barY = bottomY - barH;

      // Draw background slot
      ctx.fillStyle = "rgba(148, 163, 184, 0.1)";
      ctx.fillRect(startX, bottomY - maxBarH, barWidth, maxBarH);

      // Draw active bar
      ctx.fillStyle = item.color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(startX, barY, barWidth, barH, [6, 6, 0, 0]) : ctx.fillRect(startX, barY, barWidth, barH);
      ctx.fill();

      // Draw Value
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${Math.round(item.value)}%`, startX + barWidth / 2, barY - 6);

      // Draw Label
      ctx.fillStyle = "#94a3b8";
      ctx.font = "12px sans-serif";
      ctx.fillText(item.label, startX + barWidth / 2, bottomY + 18);

      startX += barWidth + gap;
    });
  }

    if (this.state.progress.dailyMission.date !== today || !missionQids || missionQids.length === 0) {

      const p5s = QUESTIONS.filter(q => q.part === 5).sort(() => 0.5 - Math.random()).slice(0, 6);

            level: p.level,
            topic: p.topic
          });
        });
      });
      title = "📄 Luyện Part 6: Điền đoạn văn (Text Completion)";
    } else if (partNum === 7) {
      QUESTIONS.filter(q => q.part === 7).forEach(p => {
        p.questions.forEach(sub => {
          pool.push({
            ...sub,
            part: 7,
            passage: p.passage,
            level: p.level,
            topic: p.topic
          });
        });
      });
      title = "📑 Luyện Part 7: Đọc hiểu đoạn văn (Reading Comprehension)";
    }

    this.activeQuiz = new QuizController(pool, {
      title: title,
      isExamMode: false,
      onComplete: () => {
        app.navigate("dashboard");
      }
    });
    this.activeQuiz.render(stage);
  }

  startTrapDrill(trapKey) {
    let pool = [];
    if (["sound", "repeated-word", "indirect"].includes(trapKey)) {
      pool = QUESTIONS.filter(q => q.trapCategory === trapKey);
    } else if (trapKey === "word-form") {
      pool = QUESTIONS.filter(q => q.skillTags && q.skillTags.includes("word-form"));
    } else if (trapKey === "paraphrase") {
      QUESTIONS.filter(q => q.part === 7).forEach(p => {
        p.questions.forEach(sub => {
          pool.push({ ...sub, part: 7, passage: p.passage });
        });
      });
    }

    if (pool.length === 0) {
      this.showToast("Đang cập nhật thêm câu hỏi cho nhóm bẫy này!");
      return;
    }

    const stage = document.getElementById("stageContent");
    this.activeQuiz = new QuizController(pool, {
      title: `🏹 Chuyên đề Bẫy: ${trapKey.toUpperCase()}`,
      isExamMode: false,
      onComplete: () => {
        app.navigate("traphunter");
      }
    });
    this.activeQuiz.render(stage);
  }

    const b1Count = this.state.progress.leitnerBoxes.b1.length;
    const b2Count = this.state.progress.leitnerBoxes.b2.length;
    const b3Count = this.state.progress.leitnerBoxes.b3.length;
    const b4Count = this.state.progress.leitnerBoxes.b4.length;
    const b5Count = this.state.progress.leitnerBoxes.b5.length;

    stage.innerHTML = `

          <div style="display: flex; gap: 0.5rem;">

            <button class="btn btn-secondary" onclick="app.setVocabMode('quiz')" style="${this.vocabStudyMode === 'quiz' ? 'border-color: var(--accent-cyan);' : ''}">🎯 Quiz</button>
            <button class="btn btn-secondary" onclick="app.setVocabMode('type')" style="${this.vocabStudyMode === 'type' ? 'border-color: var(--accent-cyan);' : ''}">⌨️ Gõ từ</button>

  setVocabMode(mode) {
    this.vocabStudyMode = mode;
    this.renderVocabArena(document.getElementById("stageContent"));
  }

  getVocabModeHTML(v) {
    if (this.vocabStudyMode === "card") {
      return `
        <div class="flashcard" onclick="this.classList.toggle('flipped')" title="Bấm vào thẻ để lật">
          <div class="flashcard-inner">
            <div class="card-face card-front">
              <span class="badge-tag" style="margin-bottom: 0.5rem;">${v.topic}</span>
              <div class="word-title">${v.word}</div>
              <div class="word-ipa">${v.ipa} • <em>${v.pos}</em></div>
              <button class="icon-btn" onclick="event.stopPropagation(); app.speakWord('${v.word}')" title="Nghe phát âm">🔊</button>
              <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 1.5rem;">(Bấm vào thẻ để xem nghĩa & ví dụ)</span>
            </div>
            <div class="card-face card-back">
              <div class="word-meaning">${v.meaning_vi}</div>
              <div class="word-example">"${v.example}"</div>

              <div style="font-size: 0.85rem; margin-top: 0.5rem;">
                <strong>Collocations:</strong> ${v.collocations.join(", ")}
              </div>
              <div style="font-size: 0.85rem; margin-top: 0.35rem;">
                <strong>Word Family:</strong> ${v.wordFamily.join(", ")}
              </div>
              ${v.confusableWith && v.confusableWith.length ? `
                <div style="font-size: 0.85rem; margin-top: 0.35rem; color: var(--accent-amber);">
                  <strong>Dễ nhầm với:</strong> ${v.confusableWith.join(", ")}
                </div>
              ` : ""}
            </div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 1rem; gap: 0.75rem;">
          <button class="btn btn-outline-danger" style="flex: 1;" onclick="app.gradeVocab('${v.word}', false)">❌ Chưa nhớ (Hộp 1)</button>
          <button class="btn" style="flex: 1; background: var(--accent-green);" onclick="app.gradeVocab('${v.word}', true)">✅ Đã nhớ (Lên hộp)</button>
        </div>
      `;
    } else if (this.vocabStudyMode === "quiz") {
      // Multiple choice 4 options
      const distractors = VOCAB.filter(item => item.word !== v.word).sort(() => 0.5 - Math.random()).slice(0, 3);
      const choices = [v, ...distractors].sort(() => 0.5 - Math.random());
      return `
        <div class="card" style="padding: 2rem;">
          <span class="badge-tag">${v.pos}</span>
          <div style="font-size: 1.8rem; font-weight: 800; color: var(--accent-cyan); margin: 0.5rem 0;">${v.word}</div>
          <p style="color: var(--text-sub); margin-bottom: 1.25rem;">Chọn nghĩa tiếng Việt chính xác nhất của từ trên:</p>
          <div class="choices-grid">
            ${choices.map((c, i) => `
              <div class="choice-item" onclick="app.handleVocabQuizChoice(this, ${c.word === v.word}, '${v.word}')">
                <span class="key">${i + 1}</span>
                <span>${c.meaning_vi}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    } else if (this.vocabStudyMode === "type") {
      return `
        <div class="card" style="padding: 2rem; text-align: center;">
          <span class="badge-tag">${v.pos}</span>
          <div style="font-size: 1.3rem; font-weight: 700; margin: 0.75rem 0;">"${v.meaning_vi}"</div>
          <p style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 1.5rem;">Gợi ý: từ có <strong>${v.word.length}</strong> ký tự, bắt đầu bằng '<strong>${v.word[0]}</strong>'</p>
          <div style="max-width: 320px; margin: 0 auto;">
            <input type="text" id="typeInput" placeholder="Gõ từ tiếng Anh..." style="width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 2px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 1.1rem; text-align: center; margin-bottom: 1rem;" onkeydown="if(event.key==='Enter') app.checkVocabType('${v.word}')" autofocus>
            <button class="btn" style="width: 100%;" onclick="app.checkVocabType('${v.word}')">Kiểm tra</button>
          </div>
          <div id="typeFeedback" style="margin-top: 1rem; font-weight: 600;"></div>
        </div>
      `;
    }
  }

  speakWord(text) {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    } else {
      this.showToast("Trình duyệt không hỗ trợ Web Speech API.");
    }
  }

  gradeVocab(word, remembered) {
    const boxes = this.state.progress.leitnerBoxes;
    // Remove word from all boxes
    for (let i = 1; i <= 5; i++) {
      boxes[`b${i}`] = boxes[`b${i}`].filter(w => w !== word);
    }

    if (remembered) {
      boxes.b3.push(word);
      this.gainXP(5);
      this.sound.playCorrect();
    } else {
      boxes.b1.push(word);
      this.sound.playWrong();
    }
    this.saveState();
    this.vocabIndex = (this.vocabIndex + 1) % VOCAB.length;
    this.renderVocabArena(document.getElementById("stageContent"));
  }

  handleVocabQuizChoice(elem, isCorrect, word) {
    if (isCorrect) {
      elem.classList.add("correct");
      this.sound.playCorrect();
      this.gainXP(8);
      setTimeout(() => {
        this.gradeVocab(word, true);
      }, 700);
    } else {
      elem.classList.add("wrong");
      this.sound.playWrong();
      setTimeout(() => {
        this.gradeVocab(word, false);
      }, 900);
    }
  }

  checkVocabType(word) {
    const inp = document.getElementById("typeInput");
    const fb = document.getElementById("typeFeedback");
    if (!inp) return;
    const val = inp.value.trim().toLowerCase();
    if (val === word.toLowerCase()) {
      fb.innerHTML = `<span style="color: var(--accent-green);">Chính xác! (${word})</span>`;
      this.sound.playCorrect();
      this.gainXP(10);
      setTimeout(() => {
        this.gradeVocab(word, true);
      }, 800);
    } else {
      fb.innerHTML = `<span style="color: var(--accent-rose);">Sai rồi! Đáp án đúng là: <strong>${word}</strong></span>`;
      this.sound.playWrong();
      setTimeout(() => {
        this.gradeVocab(word, false);
      }, 1500);
    }
  }

  // --- ERROR NOTEBOOK ---
  renderErrorNotebook(stage) {
    const completed = this.state.progress.completedQuestions;
    const wrongQids = Object.keys(completed).filter(id => completed[id].timesWrong > 0);

    const wrongList = [];
    wrongQids.forEach(qid => {
      let found = QUESTIONS.find(q => q.id === qid);
      if (found) {
        wrongList.push({ ...found, stat: completed[qid] });
      } else {
        QUESTIONS.forEach(item => {
          if (item.part === 7 && item.questions) {
            const sub = item.questions.find(sq => sq.id === qid);
            if (sub) wrongList.push({ ...sub, part: 7, passage: item.passage, stat: completed[qid] });
          }
        });
      }
    });

    stage.innerHTML = `
      <div class="card">
        <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 0.5rem;">📕 Sổ tay lỗi sai (Error Notebook)</h2>
        <p style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 1.25rem;">
          Hệ thống tự động ghi nhận các câu bạn từng làm sai để ôn tập lại định kỳ theo chu kỳ Spaced Repetition (1 - 3 - 7 - 14 ngày).
        </p>
        ${wrongList.length > 0 ? `
          <button class="btn" style="margin-bottom: 1.25rem;" onclick="app.practiceErrors()">🔄 Luyện tập lại toàn bộ nhóm lỗi này (${wrongList.length} câu)</button>
        ` : ""}
      </div>

      <div>
        ${wrongList.length === 0 ? `
          <div class="card" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">
            ✨ Thật tuyệt vời! Bạn chưa có câu hỏi nào bị ghi vào sổ tay lỗi sai. Hãy tiếp tục giữ vững phong độ!
          </div>
        ` : wrongList.map(item => `
          <div class="error-item">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="badge-tag">Part ${item.part} • ${item.topic || 'General'}</span>
              <span style="font-size: 0.75rem; color: var(--accent-rose); font-weight: 700;">Sai ${item.stat.timesWrong} lần</span>
            </div>
            <div style="font-weight: 600; font-size: 1rem;">${item.stem}</div>
            <div style="font-size: 0.85rem; color: var(--text-sub);">
              <strong>Giải thích:</strong> ${item.explanation_vi || 'Xem chi tiết trong mục luyện tập'}
            </div>
            ${item.trap ? `
              <div style="font-size: 0.8rem; color: var(--accent-amber);">
                <strong>Cảnh báo bẫy:</strong> ${item.trap}
              </div>
            ` : ""}
          </div>
        `).join("")}
      </div>
    `;
  }

  practiceErrors() {
    const completed = this.state.progress.completedQuestions;
    const wrongQids = Object.keys(completed).filter(id => completed[id].timesWrong > 0);
    const pool = [];
    wrongQids.forEach(qid => {
      let found = QUESTIONS.find(q => q.id === qid);
      if (found) pool.push(found);
      else {
        QUESTIONS.forEach(item => {
          if (item.part === 7 && item.questions) {
            const sub = item.questions.find(sq => sq.id === qid);
            if (sub) pool.push({ ...sub, part: 7, passage: item.passage });
          }
        });
      }
    });

    if (pool.length === 0) return;
    const stage = document.getElementById("stageContent");
    this.activeQuiz = new QuizController(pool, {
      title: "🔄 Ôn tập Sổ tay lỗi sai",
      isExamMode: false,
      onComplete: () => {
        app.navigate("errors");
      }
    });
    this.activeQuiz.render(stage);
  }

  closeModal() {
    const slot = document.getElementById("modalSlot");
    slot.hidden = true;
    slot.innerHTML = "";
  }

  exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state, null, 2));
    const dlAnchor = document.createElement("a");
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `TOEIC_Quest_Backup_${new Date().toISOString().split("T")[0]}.json`);
    dlAnchor.click();
    dlAnchor.remove();
    this.showToast("Đã xuất bản sao lưu thành công!");
  }

  importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (imported.user && imported.progress) {
          this.state = imported;
          this.saveState();
          this.closeModal();
          this.init();
          this.showToast("Đã nhập dữ liệu thành công!");
        } else {
          alert("File JSON không hợp lệ.");
        }
      } catch (err) {
        alert("Lỗi khi đọc file JSON: " + err.message);
      }
    };
    reader.readAsText(file);
  }

  resetAllData() {

  launchBossBattle() {
    const stage = document.getElementById("stageContent");

    QUESTIONS.forEach(q => {

          flatList.push({ ...sub, part: 7, passage: q.passage, level: q.level || 4 });
        });
      } else {
        flatList.push(q);
      }
    });

    const hardPool = flatList.filter(q => (q.level || 3) >= 4);
    const midPool = flatList.filter(q => (q.level || 3) === 3);
    const combined = [...hardPool.sort(() => 0.5 - Math.random()), ...midPool.sort(() => 0.5 - Math.random())];
    const bossQuestions = combined.slice(0, 25);

    this.activeQuiz = new BossBattleController(bossQuestions, {

    });

/**
 * =====================================================================
 * QUIZ CONTROLLER (Adaptive Engine, Timer, Explanation, Feedback)
 * =====================================================================
 */
class QuizController {
  constructor(questions, options = {}) {
    this.questions = questions;
    this.title = options.title || "Luyện thi TOEIC";
    this.isExamMode = !!options.isExamMode;
    this.timeLimitSeconds = (options.timeLimitMinutes || 10) * 60;
    this.onComplete = options.onComplete || (() => {});

    this.currentIndex = 0;
    this.selectedIndex = null;
    this.isAnswered = false;
    this.score = 0;
    this.isDone = false;
    this.timerInterval = null;
    this.secondsRemaining = this.timeLimitSeconds;
    this.isPlayingAudio = false;
  }

  render(container) {
    this.container = container;
    if (this.isExamMode) this.startTimer();
    this.renderCurrentQuestion();
  }

  startTimer() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      this.secondsRemaining -= 1;
      const el = document.getElementById("quizTimer");
      if (el) {
        const m = Math.floor(this.secondsRemaining / 60);
        const s = this.secondsRemaining % 60;
        el.textContent = `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }
      if (this.secondsRemaining <= 0) {
        clearInterval(this.timerInterval);
        this.finishQuiz();
      }
    }, 1000);
  }

  stopAudio() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    this.isPlayingAudio = false;
    this.updateAudioIndicator(false);
  }

  updateAudioIndicator(isPlaying) {
    this.isPlayingAudio = isPlaying;
    const ind = document.getElementById("audioPlayingInd");
    const btn = document.getElementById("playAudioBtn");
    if (ind) ind.hidden = !isPlaying;
    if (btn) btn.innerHTML = isPlaying ? "⏸️ Dừng âm thanh" : "🔊 Nghe lại (Phím Space)";
  }

  playCurrentAudio() {
    const q = this.questions[this.currentIndex];
    if (!q || (q.part !== 1 && q.part !== 2)) return;

    if (!("speechSynthesis" in window)) {
      app.showToast("Trình duyệt không hỗ trợ Web Speech API.");
      return;
    }

    if (this.isPlayingAudio) {
      this.stopAudio();
      return;
    }

    window.speechSynthesis.cancel();

    // Prepare speech script
    let fullScript = "";
    if (q.part === 1) {
      fullScript = `Statement A. ${q.choices[0]}. Statement B. ${q.choices[1]}. Statement C. ${q.choices[2]}. Statement D. ${q.choices[3]}.`;
    } else if (q.part === 2) {
      fullScript = `${q.stem}. Number A. ${q.choices[0]}. Number B. ${q.choices[1]}. Number C. ${q.choices[2]}.`;
    }

    const utterance = new SpeechSynthesisUtterance(fullScript);
    utterance.rate = app.state.user.speechRate || 1.0;
    utterance.lang = app.state.user.speechVoice || "en-US";

    // Try finding matching voice
    const voices = window.speechSynthesis.getVoices();
    const matchedVoice = voices.find(v => v.lang.startsWith(utterance.lang.substring(0, 2)));
    if (matchedVoice) utterance.voice = matchedVoice;

    utterance.onstart = () => {
      this.updateAudioIndicator(true);
    };
    utterance.onend = () => {
      this.updateAudioIndicator(false);
    };
    utterance.onerror = () => {
      this.updateAudioIndicator(false);
    };

    window.speechSynthesis.speak(utterance);
  }

  setSpeechRate(rate) {
    app.state.user.speechRate = parseFloat(rate);
    app.saveState();
    if (this.isPlayingAudio) {
      this.stopAudio();
      this.playCurrentAudio();
    }
  }

  setSpeechVoice(voice) {
    app.state.user.speechVoice = voice;
    app.saveState();
    if (this.isPlayingAudio) {
      this.stopAudio();
      this.playCurrentAudio();
    }
  }

  renderCurrentQuestion() {
    this.stopAudio();

    if (this.currentIndex >= this.questions.length) {
      this.finishQuiz();
      return;
    }

    const q = this.questions[this.currentIndex];
    this.selectedIndex = null;
    this.isAnswered = false;
    const isListening = q.part === 1 || q.part === 2;

    this.container.innerHTML = `
      <div class="quiz-container">
        <div class="quiz-meta-bar">
          <div>
            <strong>${this.title}</strong>
            <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 0.5rem;">
              Câu ${this.currentIndex + 1} / ${this.questions.length}
            </span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            ${this.isExamMode ? `<span class="timer-badge" id="quizTimer">--:--</span>` : ""}
            <span class="badge-tag">Part ${q.part}</span>
            <span class="badge-tag">Độ khó: ${q.level || 3}/5</span>
            <button class="icon-btn" onclick="app.flagQuestion('${q.id}')" title="Báo lỗi câu này" style="width: 30px; height: 30px; font-size: 0.75rem;">🚩</button>
          </div>
        </div>

        ${q.svgArt ? `
          <div class="svg-illustration-box">
            ${q.svgArt}
            <span style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">
              📸 Hình minh họa Part 1 (SVG Vector). Trong đề thi ETS thật, quan sát tranh để dự đoán hành động & vật thể.
            </span>
          </div>
        ` : ""}

        ${isListening ? `
          <div class="audio-control-bar">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <button class="btn" id="playAudioBtn" onclick="app.activeQuiz.playCurrentAudio()">
                🔊 Nghe câu hỏi & đáp án (Space)
              </button>
              <div id="audioPlayingInd" class="audio-playing-indicator" hidden>
                <div class="sound-wave-bar"></div>
                <div class="sound-wave-bar"></div>
                <div class="sound-wave-bar"></div>
                <span>Đang phát loa...</span>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;">
              <label style="color: var(--text-sub);">Tốc độ:</label>
              <select onchange="app.activeQuiz.setSpeechRate(this.value)" style="background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.25rem 0.5rem; border-radius: 6px;">
                <option value="0.8" ${app.state.user.speechRate === 0.8 ? 'selected' : ''}>0.8x (Chậm)</option>
                <option value="1.0" ${app.state.user.speechRate === 1.0 ? 'selected' : ''}>1.0x (Chuẩn ETS)</option>
                <option value="1.2" ${app.state.user.speechRate === 1.2 ? 'selected' : ''}>1.2x (Nhanh)</option>
              </select>

              <label style="color: var(--text-sub); margin-left: 0.4rem;">Giọng:</label>
              <select onchange="app.activeQuiz.setSpeechVoice(this.value)" style="background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.25rem 0.5rem; border-radius: 6px;">
                <option value="en-US" ${app.state.user.speechVoice === 'en-US' ? 'selected' : ''}>Mỹ (en-US)</option>
                <option value="en-GB" ${app.state.user.speechVoice === 'en-GB' ? 'selected' : ''}>Anh (en-GB)</option>
                <option value="en-AU" ${app.state.user.speechVoice === 'en-AU' ? 'selected' : ''}>Úc (en-AU)</option>
              </select>
            </div>
          </div>
        ` : ""}

        ${q.passage ? `
          <div class="passage-box">${q.passage}</div>
        ` : ""}

        <div class="card">
          <div class="question-stem" id="stemElem">
            ${isListening && q.part === 2 ? '<em>"Nghe câu hỏi trong đoạn băng và chọn phương án phản hồi thích hợp nhất"</em>' : q.stem}
          </div>
          <div class="choices-grid" style="margin-top: 1.25rem;">
            ${q.choices.map((c, i) => `
              <div class="choice-item" data-idx="${i}" onclick="app.activeQuiz.handleSelectChoice(${i})">
                <span class="key">${["A", "B", "C", "D"][i]}</span>
                <span class="choice-text">
                  ${isListening ? `<span style="color: var(--text-muted); font-style: italic;">(${["A", "B", "C", "D"][i]}) [Nghe qua âm thanh]</span>` : c}
                </span>
              </div>
            `).join("")}
          </div>
        </div>

        <div id="feedbackSlot"></div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.8rem; color: var(--text-muted);">
            Phím tắt: 1-${q.choices.length} (chọn đáp án), Space (nghe lại), Enter (tiếp tục)
          </span>
          <button class="btn" id="nextBtn" onclick="app.activeQuiz.handleNext()" ${this.isExamMode ? "" : "disabled"}>
            ${this.currentIndex === this.questions.length - 1 ? "Hoàn thành" : "Câu tiếp theo →"}
          </button>
        </div>
      </div>
    `;

    // Auto-play audio on question load for listening parts if sound enabled
    if (isListening && app.state.user.soundEnabled) {
      setTimeout(() => {
        this.playCurrentAudio();
      }, 400);
    }
  }

  handleSelectChoice(idx) {
    if (this.isAnswered && !this.isExamMode) return;
    this.selectedIndex = idx;
    const items = this.container.querySelectorAll(".choice-item");
    items.forEach((item, i) => {
      item.classList.toggle("selected", i === idx);
    });

    if (!this.isExamMode) {
      this.evaluateAnswer(idx);
    }
  }

  evaluateAnswer(userChoiceIdx) {
    this.stopAudio();
    this.isAnswered = true;
    const q = this.questions[this.currentIndex];
    const isCorrect = userChoiceIdx === q.answer;
    const items = this.container.querySelectorAll(".choice-item");

    // Reveal choices text for Listening parts
    items.forEach((item, i) => {
      const textElem = item.querySelector(".choice-text");
      if (textElem) textElem.textContent = q.choices[i];

      if (i === q.answer) item.classList.add("correct");
      else if (i === userChoiceIdx) item.classList.add("wrong");
    });

    // Record Stats & Adaptive State
    const comp = app.state.progress.completedQuestions[q.id] || { timesWrong: 0, timesCorrect: 0 };
    if (isCorrect) {
      comp.timesCorrect += 1;
      this.score += 1;
      app.sound.playCorrect();
      app.gainXP(15);
      app.state.adaptive.consecutiveCorrect += 1;
      app.state.adaptive.consecutiveWrong = 0;
      if (app.state.adaptive.consecutiveCorrect >= 3) {
        app.state.adaptive.currentDifficulty = Math.min(5, app.state.adaptive.currentDifficulty + 1);
        app.state.adaptive.consecutiveCorrect = 0;
      }
    } else {
      comp.timesWrong += 1;
      app.sound.playWrong();
      app.state.adaptive.consecutiveWrong += 1;
      app.state.adaptive.consecutiveCorrect = 0;
      if (app.state.adaptive.consecutiveWrong >= 2) {
        app.state.adaptive.currentDifficulty = Math.max(1, app.state.adaptive.currentDifficulty - 1);
        app.state.adaptive.consecutiveWrong = 0;
      }
    }
    app.state.progress.completedQuestions[q.id] = comp;

    // Track Part stats
    const partKey = `p${q.part}`;
    if (app.state.progress.partStats[partKey]) {
      app.state.progress.partStats[partKey].total += 1;
      if (isCorrect) app.state.progress.partStats[partKey].correct += 1;
    }
    app.saveState();

    // Show Explanation & Transcript
    const feedback = document.getElementById("feedbackSlot");
    if (feedback) {
      feedback.innerHTML = `
        <div class="explanation-panel" style="${isCorrect ? '' : 'border-top-color: var(--accent-rose);'}">
          <div style="font-weight: 700; color: ${isCorrect ? 'var(--accent-green)' : 'var(--accent-rose)'}; font-size: 1.05rem;">
            ${isCorrect ? '🎉 Chính xác!' : '❌ Chưa chính xác!'} (Đáp án đúng: ${['A','B','C','D'][q.answer]})
          </div>

          ${q.transcript ? `
            <div class="transcript-box">
              <strong style="color: var(--accent-amber); display: block; margin-bottom: 0.35rem;">📜 Audio Transcript:</strong>
              <div style="white-space: pre-line;">${this.formatTranscript(q.transcript, q.answer)}</div>
            </div>
          ` : ''}

          <div style="font-size: 0.95rem; line-height: 1.6; margin-top: 0.5rem;">
            <strong>Giải thích:</strong> ${q.explanation_vi || 'Đáp án chính xác theo ngữ cảnh câu.'}
          </div>

          ${q.trap ? `
            <div class="trap-box">
              <strong>⚠️ Phân tích bẫy TOEIC:</strong> ${q.trap}
            </div>
          ` : ''}
        </div>
      `;
    }

    const nextBtn = document.getElementById("nextBtn");
    if (nextBtn) nextBtn.disabled = false;
  }

  formatTranscript(rawTranscript, answerIdx) {
    const lines = rawTranscript.split("\n");
    const optKeys = ["(A)", "(B)", "(C)", "(D)"];
    return lines.map(line => {
      if (optKeys[answerIdx] && line.includes(optKeys[answerIdx])) {
        return `<mark>${line}</mark>`;
      }
      return line;
    }).join("\n");
  }

  handleNext() {
    this.stopAudio();
    if (this.isExamMode) {
      const q = this.questions[this.currentIndex];
      const isCorrect = this.selectedIndex === q.answer;
      if (isCorrect) this.score += 1;

      const partKey = `p${q.part}`;
      if (app.state.progress.partStats[partKey]) {
        app.state.progress.partStats[partKey].total += 1;
        if (isCorrect) app.state.progress.partStats[partKey].correct += 1;
      }
    }

    this.currentIndex += 1;
    this.renderCurrentQuestion();
  }

  finishQuiz() {
    this.stopAudio();
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.isDone = true;
    this.onComplete({
      score: this.score,
      total: this.questions.length
    });
  }
}

/**
 * =====================================================================
 * BOSS BATTLE CONTROLLER (Cyber Incident Combat Engine)
 * =====================================================================
 */
class BossBattleController {
  constructor(questions, options = {}) {
    this.questions = questions;
    this.bossMaxHP = 2500;
    this.bossHP = 2500;
    this.playerIntegrity = 100;
    this.currentIndex = 0;
    this.selectedIndex = null;
    this.isAnswered = false;
    this.score = 0;
    this.consecutiveCombo = 0;
    this.isDone = false;
    this.timerInterval = null;
    this.secondsRemaining = 20 * 60; // 20 minutes
    this.isPlayingAudio = false;
    this.onComplete = options.onComplete || (() => {});
  }

  render(container) {
    this.container = container;
    this.startTimer();
    this.renderCurrentQuestion();
  }

  startTimer() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      this.secondsRemaining -= 1;
      const el = document.getElementById("bossTimer");
      if (el) {
        const m = Math.floor(this.secondsRemaining / 60);
        const s = this.secondsRemaining % 60;
        el.textContent = `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
        if (this.secondsRemaining < 180) {
          el.style.color = "var(--accent-rose)";
          el.style.animation = "pulse 1s infinite";
        }
      }
      if (this.secondsRemaining <= 0) {
        clearInterval(this.timerInterval);
        this.renderDefeat("Hết thời gian ứng cứu! Mã độc đã mã hóa toàn bộ cơ sở dữ liệu.");
      }
    }, 1000);
  }

  stopAudio() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    this.isPlayingAudio = false;
  }

  renderCurrentQuestion() {
    this.stopAudio();

    if (this.bossHP <= 0) {
      this.renderVictory();
      return;
    }
    if (this.playerIntegrity <= 0) {
      this.renderDefeat("Tường lửa bị xuyên thủng! Tính toàn vẹn hệ thống giảm về 0%.");
      return;
    }
    if (this.currentIndex >= this.questions.length) {
      if (this.score >= 18 || this.bossHP <= 400) {
        this.renderVictory();
      } else {
        this.renderDefeat(`Bạn chỉ trả lời đúng ${this.score}/25 câu (Cần tối thiểu 18 câu để dập tắt sự cố).`);
      }
      return;
    }

    const q = this.questions[this.currentIndex];
    this.selectedIndex = null;
    this.isAnswered = false;
    const isListening = q.part === 1 || q.part === 2;

    const bossPercent = Math.max(0, Math.round((this.bossHP / this.bossMaxHP) * 100));

    this.container.innerHTML = `
      <div class="boss-arena">
        <!-- Boss Battle HUD Header -->
        <div class="boss-header-bar">
          <div style="display: flex; align-items: center; gap: 0.8rem;">
            <div style="font-size: 2rem;">👾</div>
            <div>
              <div style="font-size: 0.75rem; color: var(--accent-rose); font-weight: 800; letter-spacing: 1px;">
                MỤC TIÊU: SHADOW TITAN (ZERO-DAY APT)
              </div>
              <div style="font-size: 1.15rem; font-weight: 800;">
                Câu ${this.currentIndex + 1} / ${this.questions.length} • Level ${q.level || 4}
              </div>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 1rem;">
            ${this.consecutiveCombo >= 2 ? `
              <span class="badge-tag" style="background: rgba(245, 158, 11, 0.2); border-color: var(--accent-amber); color: var(--accent-amber); font-weight: 800; animation: pulse 1s infinite;">
                🔥 COMBO x${this.consecutiveCombo} (+50 DMG)
              </span>
            ` : ""}
            <div style="font-family: monospace; font-size: 1.3rem; font-weight: 800; color: var(--accent-amber);" id="bossTimer">
              20:00
            </div>
          </div>
        </div>

        <!-- Meters: Boss HP & Player System Integrity -->
        <div class="boss-meters-grid" style="background: var(--bg-card); padding: 1rem; border-radius: 10px; border: 1px solid var(--border-light);">
          <div class="meter-box">
            <div class="meter-label-row">
              <span style="color: var(--accent-rose);">👾 Boss HP: ${this.bossHP} / ${this.bossMaxHP}</span>
              <span>${bossPercent}%</span>
            </div>
            <div class="meter-track">
              <div class="meter-fill boss-hp-bar" style="width: ${bossPercent}%;"></div>
            </div>
          </div>

          <div class="meter-box">
            <div class="meter-label-row">
              <span style="color: var(--accent-green);">🛡️ System Integrity: ${this.playerIntegrity}%</span>
              <span>${this.playerIntegrity}%</span>
            </div>
            <div class="meter-track">
              <div class="meter-fill player-integrity-bar" style="width: ${this.playerIntegrity}%;"></div>
            </div>
          </div>
        </div>

        <div id="combatLogSlot"></div>

        ${q.svgArt ? `
          <div class="svg-illustration-box">
            ${q.svgArt}
          </div>
        ` : ""}

        ${isListening ? `
          <div class="audio-control-bar">
            <button class="btn" onclick="app.activeQuiz.playCurrentAudio()">🔊 Nghe âm thanh (Phím Space)</button>
            <span style="font-size: 0.85rem; color: var(--text-sub);">Nghe và phản xạ chọn đáp án để phòng thủ!</span>
          </div>
        ` : ""}

        ${q.passage ? `
          <div class="passage-box">${q.passage}</div>
        ` : ""}

        <div class="card">
          <div class="question-stem" id="stemElem">
            ${isListening && q.part === 2 ? '<em>"Nghe câu hỏi và chọn phản hồi đúng nhất"</em>' : q.stem}
          </div>
          <div class="choices-grid" style="margin-top: 1.25rem;">
            ${q.choices.map((c, i) => `
              <div class="choice-item" data-idx="${i}" onclick="app.activeQuiz.handleSelectChoice(${i})">
                <span class="key">${["A", "B", "C", "D"][i]}</span>
                <span class="choice-text">
                  ${isListening ? `<span style="color: var(--text-muted); font-style: italic;">(${["A", "B", "C", "D"][i]}) [Nghe qua âm thanh]</span>` : c}
                </span>
              </div>
            `).join("")}
          </div>
        </div>

        <div id="feedbackSlot"></div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.8rem; color: var(--text-muted);">
            Phím tắt: 1-${q.choices.length} (chọn đáp án), Enter (tiếp tục)
          </span>
          <button class="btn" id="nextBtn" onclick="app.activeQuiz.handleNext()" disabled>
            ${this.currentIndex === this.questions.length - 1 ? "Tổng kết chiến dịch ➔" : "Khai hỏa câu tiếp theo →"}
          </button>
        </div>
      </div>
    `;

    if (isListening && app.state.user.soundEnabled) {
      setTimeout(() => this.playCurrentAudio(), 400);
    }
  }

  playCurrentAudio() {
    const q = this.questions[this.currentIndex];
    if (!q || (q.part !== 1 && q.part !== 2)) return;

    if (!("speechSynthesis" in window)) {
      app.showToast("Trình duyệt không hỗ trợ Web Speech API.");
      return;
    }

    window.speechSynthesis.cancel();
    let fullScript = "";
    if (q.part === 1) {
      fullScript = `Statement A. ${q.choices[0]}. Statement B. ${q.choices[1]}. Statement C. ${q.choices[2]}. Statement D. ${q.choices[3]}.`;
    } else if (q.part === 2) {
      fullScript = `${q.stem}. Number A. ${q.choices[0]}. Number B. ${q.choices[1]}. Number C. ${q.choices[2]}.`;
    }

    const utterance = new SpeechSynthesisUtterance(fullScript);
    utterance.rate = app.state.user.speechRate || 1.0;
    utterance.lang = app.state.user.speechVoice || "en-US";
    window.speechSynthesis.speak(utterance);
  }

  handleSelectChoice(idx) {
    if (this.isAnswered) return;
    this.selectedIndex = idx;
    const items = this.container.querySelectorAll(".choice-item");
    items.forEach((item, i) => {
      item.classList.toggle("selected", i === idx);
    });
    this.evaluateAnswer(idx);
  }

  evaluateAnswer(userChoiceIdx) {
    this.stopAudio();
    this.isAnswered = true;
    const q = this.questions[this.currentIndex];
    const isCorrect = userChoiceIdx === q.answer;
    const items = this.container.querySelectorAll(".choice-item");

    items.forEach((item, i) => {
      const textElem = item.querySelector(".choice-text");
      if (textElem) textElem.textContent = q.choices[i];

      if (i === q.answer) item.classList.add("correct");
      else if (i === userChoiceIdx) item.classList.add("wrong");
    });

    const combatLog = document.getElementById("combatLogSlot");

    if (isCorrect) {
      this.score += 1;
      this.consecutiveCombo += 1;
      const damage = this.consecutiveCombo >= 2 ? 150 : 100;
      this.bossHP = Math.max(0, this.bossHP - damage);

      app.sound.playCorrect();
      app.gainXP(20);

      if (combatLog) {
        combatLog.innerHTML = `
          <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 0.75rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.95rem;">
            💥 CRITICAL HIT! Vá lỗ hổng thành công! Gây <strong>${damage} sát thương</strong> lên Shadow Titan!
          </div>
        `;
      }
    } else {
      this.consecutiveCombo = 0;
      this.playerIntegrity = Math.max(0, this.playerIntegrity - 10);

      app.sound.playWrong();

      const comp = app.state.progress.completedQuestions[q.id] || { timesWrong: 0, timesCorrect: 0 };
      comp.timesWrong += 1;
      app.state.progress.completedQuestions[q.id] = comp;

      if (combatLog) {
        combatLog.innerHTML = `
          <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); color: var(--accent-rose); padding: 0.75rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.95rem;">
            ⚠️ TƯỜNG LỬA BỊ XUYÊN THỦNG! Mã độc xâm nhập sâu hơn! <em>System Integrity giảm 10%</em>!
          </div>
        `;
      }
    }

    app.saveState();

    // Show Explanation & Trap Analysis
    const feedback = document.getElementById("feedbackSlot");
    if (feedback) {
      feedback.innerHTML = `
        <div class="explanation-panel" style="${isCorrect ? '' : 'border-top-color: var(--accent-rose);'}">
          <div style="font-weight: 700; color: ${isCorrect ? 'var(--accent-green)' : 'var(--accent-rose)'}; font-size: 1.05rem;">
            ${isCorrect ? '🎯 Phản kích chính xác!' : '❌ Bẫy đã kích hoạt!'} (Đáp án đúng: ${['A','B','C','D'][q.answer]})
          </div>

          <div style="font-size: 0.95rem; line-height: 1.6; margin-top: 0.5rem;">
            <strong>Giải thích:</strong> ${q.explanation_vi || 'Đáp án chính xác theo ngữ cảnh.'}
          </div>

          ${q.trap ? `
            <div class="trap-box" style="margin-top: 0.5rem;">
              <strong>⚠️ Phân tích bẫy Boss-Tier:</strong> ${q.trap}
            </div>
          ` : ''}
        </div>
      `;
    }

    const nextBtn = document.getElementById("nextBtn");
    if (nextBtn) nextBtn.disabled = false;

    // Check instant win/loss conditions
    if (this.bossHP <= 0) {
      setTimeout(() => this.renderVictory(), 1200);
    } else if (this.playerIntegrity <= 0) {
      setTimeout(() => this.renderDefeat("System Integrity giảm về 0%! Mạng lõi sập."), 1200);
    }
  }

  handleNext() {
    this.currentIndex += 1;
    this.renderCurrentQuestion();
  }

  renderVictory() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.isDone = true;

    const newRole = app.promoteCyberRole();
    app.gainXP(200);
    app.sound.playLevelUp();

    this.container.innerHTML = `
      <div class="promotion-card">
        <div class="rank-insignia">🎖️</div>
        <span class="badge-tag" style="background: rgba(16, 185, 129, 0.2); border-color: var(--accent-green); color: var(--accent-green); font-size: 0.9rem; padding: 0.3rem 0.8rem;">
          VICTORY: THREAT NEUTRALIZED
        </span>
        <h2 style="font-size: 2rem; font-weight: 900; color: #fff; margin: 1rem 0 0.5rem;">
          CHỨNG NHẬN SẮC PHONG & THĂNG CHỨC
        </h2>
        <p style="color: var(--text-sub); font-size: 1rem; max-width: 600px; margin: 0 auto 1.5rem;">
          Hội đồng An ninh Thông tin Tập đoàn HexaTech trân trọng sắc phong học viên <strong>${app.state.user.name}</strong> lên chức vụ chỉ huy an ninh mạng:
        </p>

        <div style="background: var(--bg-card); border: 2px solid var(--accent-amber); display: inline-block; padding: 1.5rem 3rem; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);">
          <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">CẤP BẬC MỚI ĐÃ ĐƯỢC PHÊ CHUẨN</span>
          <span style="font-size: 2.2rem; font-weight: 900; color: var(--accent-amber);">${newRole}</span>
          <span style="font-size: 0.9rem; color: var(--accent-green); display: block; margin-top: 0.3rem;">+200 XP • Quyền hạn SOC Cấp Cao</span>
        </div>

        <div style="max-width: 500px; margin: 0 auto; text-align: left; background: var(--bg-card); padding: 1rem 1.25rem; border-radius: 8px; border: 1px solid var(--border-light); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem;">
          <strong>📊 Báo cáo kết quả chiến dịch:</strong>
          <ul style="margin-left: 1.25rem; margin-top: 0.4rem;">
            <li>Số câu chính xác: <strong>${this.score} / ${this.questions.length}</strong></li>
            <li>Sát thương gây cho Shadow Titan: <strong>${this.bossMaxHP - this.bossHP} HP</strong> (Đã tiêu diệt)</li>
            <li>Độ toàn vẹn hệ thống giữ vững: <strong>${this.playerIntegrity}%</strong></li>
          </ul>
        </div>

        <div>
          <button class="btn" style="padding: 0.8rem 2rem; font-size: 1rem;" onclick="app.navigate('dashboard')">
            Về Dashboard Báo cáo
          </button>
        </div>
      </div>
    `;
  }

  renderDefeat(reason = "") {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.isDone = true;
    app.sound.playWrong();

    this.container.innerHTML = `
      <div class="card" style="text-align: center; padding: 2.5rem; border: 2px solid var(--accent-rose); background: radial-gradient(circle, rgba(244, 63, 94, 0.1), var(--bg-surface));">
        <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🚨</div>
        <h2 style="font-size: 1.8rem; font-weight: 900; color: var(--accent-rose); margin-bottom: 0.5rem;">
          INCIDENT ESCALATED: CHIẾN DỊCH THẤT BẠI
        </h2>
        <p style="color: var(--text-sub); max-width: 550px; margin: 0 auto 1.5rem;">
          ${reason || "Sự cố an ninh vượt quá ngưỡng khống chế. Mã độc đã lây lan sang các máy chủ khác."}
        </p>

        <div style="background: var(--bg-card); padding: 1rem; border-radius: 8px; max-width: 480px; margin: 0 auto 1.5rem; border: 1px solid var(--border-light); font-size: 0.9rem; text-align: left; line-height: 1.6;">
          <strong>💡 Lời khuyên từ CISO:</strong>
          <ul style="margin-left: 1.25rem; margin-top: 0.35rem;">
            <li>Số câu đúng đạt được: <strong>${this.score}/${this.questions.length}</strong>.</li>
            <li>Các câu bạn vừa làm sai đã được tự động lưu vào <strong>Sổ tay lỗi sai</strong>.</li>
            <li>Hãy ôn lại các bẫy đảo ngữ, thể giả định và từ vựng chuyên sâu trước khi tái đấu!</li>
          </ul>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
          <button class="btn btn-outline-danger" onclick="app.navigate('errors')">📕 Xem Sổ tay lỗi sai</button>
          <button class="btn" onclick="app.launchBossBattle()">⚔️ Tái đấu Boss ngay</button>
        </div>
      </div>
    `;
  }
}

// Global App Instance
const app = new ToeicQuestApp();
window.addEventListener("DOMContentLoaded", () => {
  app.init();
});
  </script>
